<style>


* {
    box-sizing:border-box;
}



html,
body {

    height:100%;
    margin:0;

}



body {

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:#ffffff;

    color:#111;

    font-family:"JetBrains Mono", monospace;

}



.main-wrapper {

    width:100%;

    max-width:600px;

    text-align:center;

    padding:20px;

}




/* Logo */

.owl-symbol {

    font-size:58px;

    margin-bottom:8px;

    color:#111;

    user-select:none;

}




/* Name */

.typing-container {

    min-height:35px;

    font-size:clamp(1rem,4vw,1.3rem);

    font-weight:600;

}



.cursor {

    display:inline-block;

    width:9px;

    height:1.15em;

    background:#111;

    margin-left:5px;

    animation:blink .8s infinite;

}



@keyframes blink {

    50% {
        opacity:0;
    }

}




/* Roles */

.subtitle {

    margin-top:22px;

    opacity:0;

    font-size:14px;

    transition:opacity 1s ease;

}



.subtitle.visible {

    opacity:1;

}



.subtitle a {

    color:#111;

    text-decoration:none;

    transition:opacity .3s ease;

}



.subtitle a:hover {

    opacity:.45;

}



.separator {

    margin:0 10px;

    color:#b5b5b5;

}




/* Social */

.social-links {

    margin-top:28px;

    display:flex;

    justify-content:center;

    gap:28px;

    opacity:0;

    transform:translateY(12px);

    transition:
        opacity 1s ease,
        transform 1s ease;

}



.social-links.visible {

    opacity:1;

    transform:translateY(0);

}



.social-btn {

    color:#111;

    font-size:24px;

    transition:
        transform .3s ease,
        opacity .3s ease;

}



.social-btn:hover {

    transform:translateY(-4px);

    opacity:.45;

}





@media(max-width:480px){


    .owl-symbol {

        font-size:52px;

    }


    .subtitle {

        font-size:12px;

    }


    .separator {

        margin:0 6px;

    }


}



</style>


</head>



<body>



<div class="main-wrapper">

𓅓

<script>


const text = "Mohammad Reza Maleki";


const typingText =
document.getElementById("typing-text");


const cursor =
document.getElementById("cursor");


const subtitle =
document.getElementById("subtitle");


const social =
document.getElementById("social-links");



let index = 0;



function type(){


    if(index < text.length){


        typingText.textContent += text.charAt(index);

        index++;


        setTimeout(type,70);


    } else {


        cursor.style.display="inline-block";


        setTimeout(()=>{


            subtitle.classList.add("visible");


            social.classList.add("visible");


        },500);


    }


}



window.addEventListener("load", type);



</script>
